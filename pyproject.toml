[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtcp-dxf-extractor"
version = "0.2.0"
description = "Loss-aware DXF extraction and conservative CloudTCP IF v1 mapping"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.3,<2", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cloudtcp-dxf = "cloudtcp_dxf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
